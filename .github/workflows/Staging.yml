name: Staging

on:
  pull_request:
    branches: [ master ]

# The old AWS staging deploy (push to docker.pkg.github.com + SSH to EC2) is
# retired: that registry is gone and the app now runs on its own server, which
# builds this repo's Dockerfile_Deploy. This check builds the same image.

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the production image
      run: docker build -t padma-frontend -f Dockerfile_Deploy .
